name: EnderTeamBattle
version: "${version}"

main: io.twotle.Enderteambattle
api-version: "26.2"
load: POSTWORLD

commands:
  etb:
    description: EnderTeamBattle administration command
    usage: /etb <init|start|pause|stop|team|option>
    permission: enderteambattle.admin

permissions:
  enderteambattle.admin:
    description: Grants access to all EnderTeamBattle administration commands.
    default: op
